<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nathan Liu — Mechanical Engineering Portfolio</title>
<style>
  :root {
    --navy-950: #0b1522;
    --navy-900: #0f2036;
    --navy-800: #16304f;
    --blue-line: #3f7cad;
    --blue-line-soft: rgba(63,124,173,0.35);
    --paper: #eef1f5;
    --paper-dim: #b9c4d2;
    --orange: #e8622c;
    --orange-soft: rgba(232,98,44,0.18);
    --radius-s: 3px;
    --font-head: "Space Grotesk", "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    --font-body: "Inter", "Segoe UI", sans-serif;

    /* Custom Easing Curves */
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-out-quart: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  }

  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  body {
    background: var(--navy-950);
    color: var(--paper);
    font-family: var(--font-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Blueprint grid backdrop */
  .grid-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(var(--blue-line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--blue-line-soft) 1px, transparent 1px);
    background-size: 42px 42px;
    opacity: 0.18;
    pointer-events: none;
    transition: transform 0.8s var(--ease-out-expo), opacity 0.6s ease;
  }
  body.detail-open .grid-bg {
    transform: scale(1.04);
    opacity: 0.12;
  }

  a { color: inherit; text-decoration: none; }

  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 28px;
    position: relative;
    z-index: 1;
  }

  /* ---------- SCROLL REVEAL ANIMATIONS ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(28px);
    transition:
      opacity 0.85s var(--ease-out-expo),
      transform 0.85s var(--ease-out-expo);
    transition-delay: var(--delay, 0ms);
    will-change: opacity, transform;
  }
  .reveal.in-view {
    opacity: 1;
    transform: translateY(0);
  }

  /* ---------- NAV ---------- */
  header.site-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(11,21,34,0.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--blue-line-soft);
    transition: background 0.3s ease;
  }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    max-width: 1120px;
    margin: 0 auto;
  }
  .brand {
    font-family: var(--font-mono);
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    color: var(--paper);
    display: flex;
    align-items: baseline;
    gap: 8px;
    cursor: pointer;
  }
  .brand .brand-index { color: var(--orange); }
  nav.nav-links {
    display: flex;
    gap: 28px;
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }
  nav.nav-links a {
    color: var(--paper-dim);
    position: relative;
    padding: 4px 0;
    transition: color 0.2s var(--ease-out-quart);
  }
  nav.nav-links a:hover, nav.nav-links a:focus-visible { color: var(--paper); }
  nav.nav-links a::after {
    content: "";
    position: absolute;
    left: 0; right: 100%;
    bottom: -2px;
    height: 1px;
    background: var(--orange);
    transition: right 0.3s var(--ease-out-expo);
  }
  nav.nav-links a:hover::after, nav.nav-links a:focus-visible::after { right: 0; }
  .nav-toggle {
    display: none;
    background: none;
    border: 1px solid var(--blue-line-soft);
    border-radius: var(--radius-s);
    width: 38px; height: 38px;
    color: var(--paper);
    font-family: var(--font-mono);
    cursor: pointer;
  }

  /* ---------- VIEW TRANSITION WRAPPER (HOME vs PROJECT PAGE) ---------- */
  #homeView {
    transition:
      opacity 0.45s var(--ease-out-quart),
      transform 0.55s var(--ease-out-expo);
    transform-origin: center top;
  }
  body.detail-open #homeView {
    opacity: 0;
    transform: translateY(-20px) scale(0.985);
    pointer-events: none;
    height: 0;
    overflow: hidden;
  }

  /* ---------- HERO ---------- */
  .hero {
    padding: 110px 0 90px;
    position: relative;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 48px;
    align-items: center;
  }
  .hero-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--orange);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .hero-eyebrow .dim-line {
    flex: 0 0 40px;
    height: 1px;
    background: var(--orange);
    transform-origin: left;
    animation: growLine 1s var(--ease-out-expo) forwards;
  }
  @keyframes growLine {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  .hero h1 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: clamp(2.4rem, 5vw, 4rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    max-width: 12ch;
  }
  .hero p.lede {
    margin-top: 22px;
    max-width: 46ch;
    color: var(--paper-dim);
    font-size: 1.05rem;
  }
  .hero-actions {
    margin-top: 36px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .btn {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    padding: 13px 22px;
    border-radius: var(--radius-s);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    border: 1px solid var(--blue-line-soft);
    transition:
      transform 0.25s var(--ease-out-quart),
      border-color 0.2s ease,
      background 0.2s ease,
      box-shadow 0.25s var(--ease-out-quart);
  }
  .btn:hover {
    transform: translateY(-2px);
  }
  .btn:active {
    transform: translateY(0);
  }
  .btn-primary {
    background: var(--orange);
    color: var(--navy-950);
    border-color: var(--orange);
    font-weight: 500;
  }
  .btn-primary:hover {
    background: #f07443;
    box-shadow: 0 8px 24px rgba(232, 98, 44, 0.28);
  }
  .btn-ghost { color: var(--paper); background: transparent; }
  .btn-ghost:hover { border-color: var(--paper); background: rgba(63,124,173,0.1); }

  /* Hero portrait & rotating CAD ring */
  .hero-diagram {
    aspect-ratio: 1/1;
    position: relative;
  }
  .hero-diagram svg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .hero-diagram .cad-ring {
    transform-origin: 150px 150px;
    animation: slowSpin 48s linear infinite;
  }
  @keyframes slowSpin {
    to { transform: rotate(360deg); }
  }
  .hero-diagram .portrait-frame {
    position: absolute;
    inset: 14%;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--blue-line-soft);
    transition: border-color 0.4s ease, transform 0.6s var(--ease-out-expo);
  }
  .hero-diagram:hover .portrait-frame {
    border-color: var(--orange);
    transform: scale(1.02);
  }
  .hero-diagram .portrait-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ---------- SECTION SCAFFOLD ---------- */
  section {
    padding: 88px 0;
    position: relative;
    border-top: 1px solid var(--blue-line-soft);
  }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 52px;
    flex-wrap: wrap;
  }
  .section-num {
    font-family: var(--font-mono);
    color: var(--orange);
    font-size: 0.85rem;
  }
  .section-head h2 {
    font-family: var(--font-head);
    font-size: clamp(1.7rem, 3vw, 2.3rem);
    font-weight: 600;
  }
  .section-tag {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--paper-dim);
    text-align: right;
    max-width: 28ch;
  }

  /* ---------- ABOUT ---------- */
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 56px;
  }
  .about-copy p {
    color: var(--paper-dim);
    margin-bottom: 18px;
    max-width: 60ch;
  }
  .about-copy p:first-child { color: var(--paper); font-size: 1.08rem; }
  .spec-sheet {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    border: 1px solid var(--blue-line-soft);
    border-radius: var(--radius-s);
    overflow: hidden;
    background: rgba(15, 32, 54, 0.55);
  }
  .spec-sheet .spec-title {
    background: var(--navy-800);
    padding: 10px 16px;
    color: var(--orange);
    border-bottom: 1px solid var(--blue-line-soft);
    display: flex;
    justify-content: space-between;
  }
  .spec-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--blue-line-soft);
    transition: background 0.25s ease, padding-left 0.25s var(--ease-out-quart);
  }
  .spec-row:hover {
    background: rgba(63, 124, 173, 0.12);
    padding-left: 22px;
  }
  .spec-row:last-child { border-bottom: none; }
  .spec-row dt { color: var(--paper-dim); }
  .spec-row dd { color: var(--paper); text-align: right; }

  /* ---------- INTERACTIVE PROJECT CARDS ---------- */
  .project-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 28px;
  }
  .project-card {
    background: var(--navy-900);
    border-radius: var(--radius-s);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    position: relative;
    border: 1px solid var(--blue-line-soft);
    transition:
      transform 0.45s var(--ease-out-expo),
      border-color 0.35s var(--ease-out-quart),
      box-shadow 0.45s var(--ease-out-expo);
  }
  /* Corner drafting register ticks on cards */
  .project-card::before,
  .project-card::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    border: 2px solid var(--orange);
    z-index: 3;
    opacity: 0;
    transition: opacity 0.3s var(--ease-out-quart), transform 0.35s var(--ease-out-expo);
    pointer-events: none;
  }
  .project-card::before {
    top: 8px; left: 8px;
    border-right: none; border-bottom: none;
    transform: translate(-6px, -6px);
  }
  .project-card::after {
    bottom: 8px; right: 8px;
    border-left: none; border-top: none;
    transform: translate(6px, 6px);
  }
  .project-card:hover,
  .project-card:focus-visible {
    transform: translateY(-7px);
    border-color: var(--orange);
    box-shadow: 0 20px 42px rgba(5, 11, 20, 0.65);
    outline: none;
  }
  .project-card:hover::before,
  .project-card:focus-visible::before,
  .project-card:hover::after,
  .project-card:focus-visible::after {
    opacity: 1;
    transform: translate(0, 0);
  }
  .project-thumb {
    aspect-ratio: 4/3;
    position: relative;
    background: var(--navy-800);
    overflow: hidden;
  }
  .project-thumb img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform 0.7s var(--ease-out-expo), filter 0.4s ease;
  }
  .project-card:hover .project-thumb img {
    transform: scale(1.06);
  }
  .project-thumb .thumb-tag {
    position: absolute;
    top: 12px; left: 12px;
    z-index: 2;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    background: rgba(11, 21, 34, 0.9);
    backdrop-filter: blur(4px);
    color: var(--orange);
    padding: 4px 9px;
    border-radius: var(--radius-s);
    border: 1px solid var(--orange-soft);
  }
  .project-thumb .thumb-index {
    position: absolute;
    bottom: 12px; right: 12px;
    z-index: 2;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    background: rgba(11, 21, 34, 0.85);
    color: var(--paper-dim);
    padding: 3px 8px;
    border-radius: var(--radius-s);
    border: 1px solid var(--blue-line-soft);
  }
  .project-body {
    padding: 22px 22px 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .project-body h3 {
    font-family: var(--font-head);
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 10px;
    transition: color 0.25s ease;
  }
  .project-card:hover .project-body h3 {
    color: var(--orange);
  }
  .project-body p {
    color: var(--paper-dim);
    font-size: 0.92rem;
    flex: 1;
  }
  .project-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--blue-line);
  }
  .project-meta span {
    border: 1px solid var(--blue-line-soft);
    padding: 3px 8px;
    border-radius: var(--radius-s);
  }
  .project-cta {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--blue-line-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--paper);
  }
  .project-cta .arrow {
    color: var(--orange);
    display: inline-block;
    transition: transform 0.35s var(--ease-out-expo);
  }
  .project-card:hover .project-cta .arrow {
    transform: translateX(6px);
  }

  /* ---------- EXPANDING CARD CLONE OVERLAY (FLIP TRANSITION) ---------- */
  .transition-clone {
    position: fixed;
    z-index: 120;
    background: var(--navy-900);
    border: 1px solid var(--orange);
    border-radius: var(--radius-s);
    overflow: hidden;
    pointer-events: none;
    transition:
      top 0.55s var(--ease-out-expo),
      left 0.55s var(--ease-out-expo),
      width 0.55s var(--ease-out-expo),
      height 0.55s var(--ease-out-expo),
      opacity 0.4s ease;
  }

  /* ---------- DYNAMIC PROJECT DETAIL VIEW (NEW PAGE) ---------- */
  .project-page {
    display: none;
    min-height: calc(100vh - 65px);
    padding: 48px 0 96px;
    position: relative;
    z-index: 20;
    opacity: 0;
    transform: translateY(24px);
    transition:
      opacity 0.55s var(--ease-out-expo),
      transform 0.55s var(--ease-out-expo);
  }
  body.detail-open .project-page {
    display: block;
  }
  body.detail-open .project-page.active {
    opacity: 1;
    transform: translateY(0);
  }

  .detail-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 24px;
    margin-bottom: 36px;
    border-bottom: 1px solid var(--blue-line-soft);
    flex-wrap: wrap;
  }
  .back-btn {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--paper);
    background: var(--navy-900);
    border: 1px solid var(--blue-line-soft);
    padding: 10px 18px;
    border-radius: var(--radius-s);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition:
      border-color 0.2s ease,
      transform 0.25s var(--ease-out-quart),
      background 0.2s ease;
  }
  .back-btn:hover {
    border-color: var(--orange);
    background: var(--navy-800);
    transform: translateX(-4px);
  }
  .detail-doc-id {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--paper-dim);
  }
  .detail-doc-id strong {
    color: var(--orange);
    font-weight: 500;
  }

  .detail-header {
    margin-bottom: 36px;
  }
  .detail-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--orange);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }
  .detail-title {
    font-family: var(--font-head);
    font-size: clamp(2rem, 4.2vw, 3.2rem);
    line-height: 1.1;
    margin-bottom: 16px;
  }
  .detail-subtitle {
    font-size: 1.1rem;
    color: var(--paper-dim);
    max-width: 70ch;
  }

  .detail-hero-media {
    position: relative;
    background: var(--navy-900);
    border: 1px solid var(--blue-line-soft);
    border-radius: var(--radius-s);
    overflow: hidden;
    margin-bottom: 48px;
    aspect-ratio: 16/9;
    max-height: 540px;
    width: 100%;
  }
  .detail-hero-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .detail-hero-caption {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 12px 18px;
    background: linear-gradient(to top, rgba(11,21,34,0.95), transparent);
    font-family: var(--font-mono);
    font-size: 0.76rem;
    color: var(--paper-dim);
    display: flex;
    justify-content: space-between;
  }

  .detail-content-grid {
    display: grid;
    grid-template-columns: 1.55fr 1fr;
    gap: 48px;
    align-items: start;
  }
  .detail-narrative h3 {
    font-family: var(--font-head);
    font-size: 1.3rem;
    margin: 28px 0 12px;
    color: var(--paper);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .detail-narrative h3:first-child {
    margin-top: 0;
  }
  .detail-narrative h3::before {
    content: "//";
    font-family: var(--font-mono);
    font-size: 0.9rem;
